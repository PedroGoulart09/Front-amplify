# .github/workflows/deploy.yml

name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Amplify CLI
        run: npm install -g @aws-amplify/cli

      - name: Install dependencies
        run: npm install

      - name: Amplify Pull (CI/CD setup)
        run: amplify pull --appId d3obmymrm174m3 --envName prod --yes
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AMPLIFY_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AMPLIFY_SECRET_KEY }}
          AWS_REGION: us-east-2

      - name: Build
        run: npm run build

      - name: Deploy on Amplify
        run: amplify push --yes
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AMPLIFY_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AMPLIFY_SECRET_KEY }}
          AWS_REGION: us-east-2
